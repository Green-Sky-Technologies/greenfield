# Build the FigCraft web editor from source (pinned tag, craft-fonts, tools and our patches) on a
# clean runner and publish the static site as an artifact. Pins are in
# spikes/0.2-fork-build/versions.env; the build runs in the same image as the local
# reproducibility check (spikes/0.2-fork-build/verify/docker-build.sh). build.sh fails any .wasm
# over 25 MiB raw (SPEC.md D26) on every build.
name: figcraft-web

on:
  workflow_dispatch:
  push:
    paths:
      - 'spikes/0.2-fork-build/**'
      - '.github/workflows/figcraft-web.yml'
  pull_request:
    paths:
      - 'spikes/0.2-fork-build/**'
      - '.github/workflows/figcraft-web.yml'

permissions:
  contents: read

concurrency:
  group: figcraft-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # Must equal BUILD_IMAGE in versions.env (checked in the first step).
    container: rust:1.100-trixie@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Check the image pin
        run: |
          grep -qx 'BUILD_IMAGE=rust:1.100-trixie@sha256:223cc32ddca8f3ee90c436dbc94b6b5f052ea7f9653c5201e9612f08ad7d21b8' \
            spikes/0.2-fork-build/versions.env

      - name: Cache cargo registry, git deps, tools and target dir
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            /usr/local/cargo/bin/trunk
            /usr/local/cargo/bin/wasm-bindgen
            spikes/0.2-fork-build/figcraft/target
          key: figcraft-web-${{ hashFiles('spikes/0.2-fork-build/*.sh', 'spikes/0.2-fork-build/versions.env', 'spikes/0.2-fork-build/patches/**') }}
          restore-keys: figcraft-web-

      - name: Pinned toolchain (binaryen, brotli, wasm32 target, trunk, wasm-bindgen)
        run: spikes/0.2-fork-build/toolchain.sh

      - name: Build (pinned sources and fonts, patches, trunk build --release, size gate)
        run: spikes/0.2-fork-build/build.sh

      - name: Upload static site
        uses: actions/upload-artifact@v4
        with:
          name: figcraft-web-dist
          path: spikes/0.2-fork-build/dist/
          if-no-files-found: error
          retention-days: 14
