name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: greenfield
          POSTGRES_PASSWORD: greenfield
          POSTGRES_DB: greenfield
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U greenfield" --health-interval 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://greenfield:greenfield@localhost:5433/greenfield_test
      DATABASE_URL: postgres://greenfield:greenfield@localhost:5433/greenfield
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  bridge:
    # Story 1.3: packages/bridge against the pinned editor release, served by a tiny static host
    # (no app server, no secrets). check:commands fails when the editor's command list no longer
    # matches the committed generated types.
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch the pinned editor (sha256-checked)
        run: node apps/web/scripts/fetch-editor.mjs
      - run: pnpm --filter @greenfield/bridge exec playwright install --with-deps chromium firefox webkit
      - name: Generated command types match the pinned editor
        run: pnpm --filter @greenfield/bridge check:commands
      # Firefox is left out on CI: headless Firefox on GPU-less Linux runners gets no WebGL2, so
      # the editor can't create a surface (forcing webgl prefs didn't help). Run it locally:
      #   pnpm --filter @greenfield/bridge e2e --project firefox
      - run: pnpm --filter @greenfield/bridge e2e --project chromium --project webkit
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-playwright-results
          path: packages/bridge/test-results
          retention-days: 7

  e2e:
    needs: check
    runs-on: ubuntu-latest
    # Signed-out smoke tests, the app suite (e2e/app: real Clerk sign-in, roles, workspaces) and
    # the embedded editor in Chromium, WebKit and Firefox (e2e/editor).
    # Needs a Clerk *development* instance (pk_test_/sk_test_); skipped until the secrets are
    # configured. The suite creates its own users and orgs per run and deletes them afterwards.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY_TEST }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY_TEST }}
      CLERK_WEBHOOK_SIGNING_SECRET: ${{ secrets.CLERK_WEBHOOK_SIGNING_SECRET_TEST }}
      CREDENTIALS_MASTER_KEYS: ${{ secrets.CREDENTIALS_MASTER_KEYS_TEST }}
      DATABASE_URL: postgres://greenfield:greenfield@localhost:5433/greenfield
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: greenfield, POSTGRES_PASSWORD: greenfield, POSTGRES_DB: greenfield }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U greenfield" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @greenfield/web exec playwright install --with-deps
      - run: pnpm --filter @greenfield/web build
      - run: pnpm --filter @greenfield/web e2e
      - run: pnpm --filter @greenfield/web e2e:app
        env:
          E2E_SKIP_BUILD: '1'
      - run: pnpm --filter @greenfield/web e2e:editor
      # The teardown project normally deletes the run's Clerk users and orgs; if the run was
      # cancelled or crashed first, delete what it recorded.
      - if: cancelled() || failure()
        run: pnpm exec tsx apps/web/e2e/app/cleanup.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-app-report
          path: |
            apps/web/playwright-report
            apps/web/test-results/e2e-app
            apps/web/test-results/e2e-editor
          retention-days: 7
