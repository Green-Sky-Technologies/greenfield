# Named so the renamed database (Story 1.1) gets its own volume; the old crunchdesign_pgdata is left alone.
name: greenfield
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: greenfield
      POSTGRES_PASSWORD: greenfield
      POSTGRES_DB: greenfield
    ports: ['5433:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greenfield']
      interval: 2s
      retries: 20
volumes:
  pgdata:
